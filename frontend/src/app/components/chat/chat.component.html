<div class="chat-screen">
  <div class="chat-header">
    <div class="chat-header-info">
      <div class="status-dot"></div>
      <span>Learning your taste in <strong>{{ domain }}</strong></span>
    </div>
    <span class="progress-hint">3–4 exchanges to your matches</span>
  </div>

  <div class="messages">
    <div
      *ngFor="let msg of messages"
      class="message"
      [class.message-user]="msg.role === 'user'"
      [class.message-assistant]="msg.role === 'assistant'"
    >
      <div *ngIf="msg.role === 'assistant'" class="msg-avatar">IS</div>
      <div class="msg-bubble">{{ msg.content }}</div>
    </div>

    <!-- Streaming message -->
    <div *ngIf="isStreaming && streamingText" class="message message-assistant">
      <div class="msg-avatar">IS</div>
      <div class="msg-bubble streaming">{{ displayStreamText }}</div>
    </div>

    <!-- Typing indicator -->
    <div *ngIf="isStreaming && !streamingText" class="message message-assistant">
      <div class="msg-avatar">IS</div>
      <div class="msg-bubble typing">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div #messagesEnd></div>
  </div>

  <div class="chat-input-area">
    <textarea
      #chatInput
      class="chat-input"
      [(ngModel)]="inputText"
      (keydown)="handleKey($event)"
      placeholder="Tell me more..."
      rows="2"
      [disabled]="isStreaming"
    ></textarea>
    <button
      class="send-btn"
      (click)="send()"
      [disabled]="!inputText.trim() || isStreaming"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
</div>
